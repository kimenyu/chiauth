<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New login detected</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f5; margin: 0; padding: 40px 0; }
    .container { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .header { background: #18181b; padding: 32px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 20px; font-weight: 600; }
    .body { padding: 40px 32px; }
    .body p { color: #3f3f46; line-height: 1.6; margin: 0 0 16px; }
    .detail-box { background: #f4f4f5; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
    .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e4e4e7; font-size: 14px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #71717a; }
    .detail-value { color: #18181b; font-weight: 500; }
    .footer { padding: 24px 32px; border-top: 1px solid #e4e4e7; }
    .footer p { color: #a1a1aa; font-size: 13px; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{{.AppName}}</h1>
    </div>
    <div class="body">
      <p>Hi {{.FirstName}},</p>
      <p>A new login was detected on your account.</p>
      <div class="detail-box">
        <div class="detail-row">
          <span class="detail-label">IP Address</span>
          <span class="detail-value">{{.IPAddress}}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Device</span>
          <span class="detail-value">{{.DeviceInfo}}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Time</span>
          <span class="detail-value">{{.Time}}</span>
        </div>
      </div>
      <p>If this was you, no action is needed. If you don't recognise this login, please change your password immediately.</p>
    </div>
    <div class="footer">
      <p>Need help? Contact us at {{.SupportEmail}}</p>
    </div>
  </div>
</body>
</html>
